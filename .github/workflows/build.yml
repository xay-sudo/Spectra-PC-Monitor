name: Build & Release Cross-Platform App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SpectraMonitor-Linux
            pyinstaller_cmd: pyinstaller --onefile --windowed --name="SpectraMonitor-Linux" --add-data "app_icon.png:." --noconfirm --clean main.py
            output_binary: dist/SpectraMonitor-Linux
          - os: windows-latest
            artifact_name: SpectraMonitor-Windows.exe
            pyinstaller_cmd: pyinstaller --onefile --windowed --name="SpectraMonitor-Windows" --add-data "app_icon.png;." --noconfirm --clean main.py
            output_binary: dist/SpectraMonitor-Windows.exe
          - os: macos-latest
            artifact_name: SpectraMonitor-macOS.app
            pyinstaller_cmd: pyinstaller --onefile --windowed --name="SpectraMonitor-macOS" --add-data "app_icon.png:." --noconfirm --clean main.py
            output_binary: dist/SpectraMonitor-macOS.app

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 psutil GPUtil pyinstaller

    - name: Build with PyInstaller
      run: ${{ matrix.pyinstaller_cmd }}

    # Zip macOS .app bundle to preserve its internal directory structure
    - name: Compress macOS app bundle
      if: matrix.os == 'macos-latest'
      run: |
        ditto -c -k --sequesterRsrc dist/SpectraMonitor-macOS.app dist/SpectraMonitor-macOS.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.os == 'macos-latest' && 'dist/SpectraMonitor-macOS.zip' || matrix.output_binary }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/SpectraMonitor-Linux/SpectraMonitor-Linux
          artifacts/SpectraMonitor-Windows.exe/SpectraMonitor-Windows.exe
          artifacts/SpectraMonitor-macOS.app/SpectraMonitor-macOS.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
